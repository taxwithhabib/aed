name: Backfill CBUAE history (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/backfill_raw.py
      - name: Save
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add backfill/raw.json
          git commit -m "Backfill raw CBUAE rows 2018-2019" || exit 0
          git pull --rebase
          git push
