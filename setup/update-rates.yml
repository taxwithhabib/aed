name: Update CBUAE rates

on:
  schedule:
    # CBUAE publishes around 6:05 PM UAE time, Monday to Friday.
    # 15:20 UTC = 7:20 PM Dubai; 18:20 UTC = 10:20 PM Dubai (second try).
    - cron: "20 15 * * 1-5"
    - cron: "20 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's CBUAE rates
        run: python scripts/update_rates.py
      - name: Save changes
        run: |
          if git diff --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json hist
          git commit -m "CBUAE rates for $(python -c 'import json;print(json.load(open("rates.json"))["rateDate"])')"
          git push
